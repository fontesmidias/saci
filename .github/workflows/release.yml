name: Release

# Roda só quando uma tag vNN.NN.NN é publicada -- empacota o app de
# desktop no Windows e anexa o instalador ao GitHub Release já criado
# para essa tag (ver PLAN.md, Etapa 8).
#
# Não executa o .exe aqui: um runner do GitHub Actions não tem sessão
# de desktop interativa, e um app com janela nativa (pywebview) não
# sobe de forma confiável nesse ambiente por motivos que não têm
# relação com o binário estar certo ou não -- três hipóteses de
# ambiente (WebView2 ausente, sessão não-interativa, scan do Defender)
# foram testadas e descartadas sem nunca fechar o intervalo. É também
# o padrão comum para projetos PyInstaller + Inno Setup: build no CI,
# execução real testada localmente antes de marcar a tag (ver PLAN.md,
# Etapa 7 -- três inicializações consecutivas do .exe empacotado).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows-installer:
    runs-on: windows-latest
    # O padrão do repositório é GITHUB_TOKEN só-leitura; softprops/action-gh-release
    # precisa de escrita em "contents" para anexar o instalador ao release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_rules varre o histórico

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install do projeto + extras de empacotamento
        run: python -m pip install -e ".[desktop,build]"

      - name: Regras invioláveis (CLAUDE.md)
        run: python scripts/check_rules.py

      - name: Gerar o ícone (saci/saci.ico)
        run: python scripts/build_icon.py

      - name: Empacotar com PyInstaller
        run: python -m PyInstaller saci.spec --noconfirm

      - name: Verificação de tamanho (meta 70 MB)
        shell: pwsh
        run: |
          $tamanho = (Get-ChildItem -Recurse dist\Saci | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Output "dist\Saci: $([math]::Round($tamanho, 1)) MB"
          if ($tamanho -gt 70) {
            Write-Error "Acima da meta de 70 MB -- revise as exclusões em saci.spec antes de liberar."
            exit 1
          }

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Extrair a versão da tag
        id: versao
        shell: bash
        run: echo "versao=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar o instalador
        shell: pwsh
        run: |
          # O caminho de instalação do Inno Setup via choco varia entre
          # runners (Program Files vs. Program Files (x86)) — procura em
          # vez de fixar um caminho, para não falhar silenciosamente.
          $iscc = Get-ChildItem -Path "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            Write-Error "ISCC.exe não encontrado após 'choco install innosetup'."
            exit 1
          }
          Write-Output "Usando: $iscc"
          & $iscc "/DMyAppVersion=${{ steps.versao.outputs.versao }}" saci.iss

      - name: Publicar no GitHub Release desta tag
        uses: softprops/action-gh-release@v3
        with:
          files: Output/Saci-Setup-*.exe
          fail_on_unmatched_files: true
