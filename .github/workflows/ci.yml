name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_rules varre o histórico
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Regras invioláveis (CLAUDE.md)
        run: python scripts/check_rules.py
      - name: Lint
        run: ruff check saci
      - name: Import everything
        run: python -c "import saci, saci.server, saci.cli, saci.catalog, saci.usage, saci.prefs"
      - name: CLI smoke test (no keys needed)
        run: python -m saci.cli --profiles
